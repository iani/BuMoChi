# Render Blueprint: the FastAPI backend as a free web service, auto-deployed from main.
# Dashboard → New → Blueprint → pick this repo → Apply. See docs/DEPLOY.md.
services:
  - type: web
    name: ai-and-music-2026-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: AUDIO_TMP_DIR
        value: /tmp/audio
      # Production + preview frontends on Cloudflare Pages (JSON list, pydantic-settings syntax).
      - key: AUDIO_CORS_ORIGINS
        value: '["https://ai-and-music-2026.pages.dev"]'
      - key: AUDIO_CORS_ORIGIN_REGEX
        value: '^https://([a-z0-9-]+\.)?ai-and-music-2026\.pages\.dev$'
